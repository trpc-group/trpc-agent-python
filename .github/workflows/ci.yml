name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: [self-hosted, trpc-agent-python-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD -- '*.py' | grep '^trpc_agent_sdk/' || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACM HEAD~1...HEAD -- '*.py' | grep '^trpc_agent_sdk/' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "$FILES" > "$RUNNER_TEMP/changed_py_files.txt"
            echo "Changed Python files:"
            echo "$FILES"
          fi

      - name: Check formatting with YAPF
        if: steps.changed.outputs.has_files == 'true'
        run: |
          FILES=$(cat "$RUNNER_TEMP/changed_py_files.txt" | tr '\n' ' ')
          diff_output=$(yapf --diff $FILES) || true
          if [ -n "$diff_output" ]; then
            echo "$diff_output"
            echo "::error::Code formatting check failed for changed files. Run 'yapf -i <file>' to fix."
            exit 1
          fi

      - name: Lint with flake8
        if: steps.changed.outputs.has_files == 'true'
        run: |
          FILES=$(cat "$RUNNER_TEMP/changed_py_files.txt" | tr '\n' ' ')
          flake8 $FILES

  test:
    runs-on: [self-hosted, trpc-agent-python-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install package and dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        # run: pytest --cov=trpc_agent_sdk --cov-report=xml --cov-report=term tests/
        run: pytest --cov=trpc_agent_sdk --cov-report=xml --cov-report=term --cov-fail-under=80 tests/

      # examples/optimization/eval_optimize_loop/tests/ 不在根 pytest testpaths
      # （tests/）覆盖范围，需显式纳入，否则该示例工程的黄金/归因/过拟合等
      # 验收测试不会进入 CI 回归门禁（reviewer Warning）。
      - name: Run example pipeline tests
        run: |
          pytest -q examples/optimization/eval_optimize_loop/tests/ -p no:warnings

      # reviewer Warning：CI 从仓库根跑 example tests 依赖 conftest 的绝对路径
      # （data_dir / ...），未覆盖"按文档默认命令从 example 目录运行
      # run_pipeline.py"的真实入口。补默认参数（不传显式路径）冒烟，验证相对
      # 路径（data/...）在 example 目录下按文档可用。fake 模式离线确定性、<3s。
      - name: Smoke-test example default entrypoint
        run: python run_pipeline.py --mode fake
        working-directory: examples/optimization/eval_optimize_loop

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: coverage.xml

  build:
    runs-on: [self-hosted, trpc-agent-python-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Verify package
        run: |
          pip install dist/*.whl
          python -c "import trpc_agent_sdk; print('Import OK')"
